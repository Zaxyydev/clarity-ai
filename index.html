<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b16">
<title>CLARITY AI</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261128workspace6">
</head>
<body>
<div id="app">
  <header>
    <button class="circle" id="menuBtn" aria-label="Buka menu">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 9h14M4 15h9"/></svg>
    </button>
    <div class="brandwrap">
      <button class="brand" id="modelBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
        <img class="brand-mark" src="icons/logo-mark.svg" alt="" aria-hidden="true">
        <span id="modelBtnLabel">CLARITY AI</span>
        <svg class="ic chev" viewBox="0 0 24 24" style="width:16px;height:16px;stroke-width:2.4"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="modelmenu" id="modelMenu" role="listbox" hidden></div>
    </div>
    <span class="spacer"></span>
    <button class="circle" id="helpBtn" type="button" aria-label="Bantuan halaman ini"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1.1.9-1.1 1.7M12 16.8v.01"/></svg></button>
    <button class="circle" id="newTop" aria-label="Obrolan baru">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 20.5c-1.6 0-3.1-.4-4.4-1.2L3.5 20.5l1.3-3.6A8.3 8.3 0 0 1 3.5 12 8.5 8.5 0 1 1 12 20.5z"/></svg>
    </button>
  </header>

  <main id="scroll">
    <div id="empty">
      <span class="orb"></span><span class="rings"></span>
      <svg class="spk a" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"/></svg>
      <svg class="spk b" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"/></svg>
      <svg class="spk c" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"/></svg>
      <div class="home-intro">
        <div class="home-mark"><img src="icons/logo-mark.svg" alt="CLARITY AI"></div>
        <div class="home-kicker"><span class="live-dot"></span> YOUR AI WORKSPACE</div>
        <h1>Selamat datang di <strong>CLARITY AI</strong><span class="home-spark"> ✦</span></h1>
        <p>Tanya, eksplorasi, dan buat sesuatu. Semua alat favoritmu ada di satu tempat.</p>
      </div>
      <div class="home-shortcuts" id="homeQuickTools">
        <div class="quick-head"><span>Quick tools</span><small>PILIH FITUR</small></div>
        <div class="quick-grid">
          <button type="button" class="quick-tool" data-section="t"><i class="qt-icon qt-purple">▧</i><span><b>AI Image & Video</b><small>Buat dan olah visual</small></span><em>↗</em></button>
          <button type="button" class="quick-tool" data-section="m"><i class="qt-icon qt-blue">⌘</i><span><b>Tools</b><small>Generator & utilitas</small></span><em>↗</em></button>
          <button type="button" class="quick-tool" data-section="d"><i class="qt-icon qt-green">↓</i><span><b>Downloader</b><small>Unduh media</small></span><em>↗</em></button>
          <button type="button" class="quick-tool" data-section="k"><i class="qt-icon qt-pink">✧</i><span><b>AI Maker</b><small>Kreasi teks & konten</small></span><em>↗</em></button>
          <button type="button" class="quick-tool" data-section="s"><i class="qt-icon qt-cyan">⌕</i><span><b>Stalk Account</b><small>Cari info akun publik</small></span><em>↗</em></button>
          <button type="button" class="quick-tool" data-section="a"><i class="qt-icon qt-gold">ⓘ</i><span><b>About website</b><small>Info CLARITY AI</small></span><em>↗</em></button>
        </div>
      </div>
      <div class="home-footnote"><span>✦</span> Pilih alat untuk membukanya, atau langsung mulai chat di bawah.</div>
    </div>
    <div id="thread" aria-live="polite"></div>
  </main>

  <section id="toolView" aria-label="Alat">
    <div class="hero" id="toolHero"></div>
    <div class="banner" id="toolBanner" hidden></div>
    <form id="toolForm">
      <div id="toolFields"></div>
      <div class="actbar"><button class="go" id="goBtn" type="submit" disabled>Proses</button></div>
    </form>
    <div class="status" id="toolStatus" hidden></div>
    <div id="toolOut"></div>
    <div class="steps" id="toolSteps"></div>
    <p class="fine" id="toolFine"></p>
  </section>

  <section id="aboutView" aria-label="Tentang website">
    <div class="hero" id="aboutHero"></div>
    <div class="banner" id="aboutBanner" hidden></div>
    <div id="aboutBody"></div>
  </section>

  <footer>
    <div id="starters">
      <button class="starter" data-q="Bantu aku menulis pesan yang sopan untuk menolak ajakan kerja sama.">
        <svg class="ic" viewBox="0 0 24 24"><path d="M16.5 3.5l4 4L8 20l-5 1 1-5z"/></svg>Tulis atau edit
      </button>
      <button class="starter" data-q="Jelaskan cara kerja internet dengan bahasa sederhana.">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>Jelaskan sesuatu
      </button>
      <button class="starter" data-q="Buatkan contoh fungsi JavaScript untuk menghitung diskon harga.">
        <svg class="ic" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>Bantu coding
      </button>
    </div>
    <form class="composer" id="form" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Tanya CLARITY AI" aria-label="Pesan"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="Kirim" disabled></button>
    </form>
    <p class="note">CLARITY AI bisa keliru. Periksa info penting.</p>
  </footer>
</div>

<div id="scrim"></div>

<aside id="drawer" aria-label="Menu">
  <h2 class="drawer-brand"><img src="icons/logo-mark.svg" alt="" aria-hidden="true"><span>CLARITY <b>AI</b></span></h2>
  <div class="dsearch"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="dq" type="search" placeholder="Cari alat…" aria-label="Cari alat" autocomplete="off"></div>
  <div class="dscroll">
    <button class="nav" id="histNav" type="button"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="grow">Riwayat &amp; proses</span><span class="cnt" id="histCnt">0</span></button>
    <div id="navList"></div>
    <div class="label">Obrolan</div>
    <div id="list"></div>
  </div>
  <button class="newchat" id="newDrawer">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5l4 4L8 20l-5 1 1-5z" transform="translate(-1 -1)"/></svg>Obrolan baru
  </button>
</aside>

<script src="js/core.js?v=20261128c"></script>
<script src="js/jobs.js?v=20261128c"></script>
<script src="js/chat.js?v=20261128c"></script>
<script src="js/tools.js?v=20261128c"></script>
<script src="js/toolsmenu.js?v=20261128c"></script>
<script src="js/downloader.js?v=20261128c"></script>
<script src="js/stalk.js?v=20261128c"></script>
<script src="js/maker.js?v=20261128c"></script>
<script src="js/ikyyxd.js?v=20261128c"></script>
<script src="js/zyvor2.js?v=20261128c"></script>
<script src="js/about.js?v=20261128c"></script>
<script>
  App.boot();
  document.querySelectorAll('.quick-tool[data-section]').forEach(button => {
    button.addEventListener('click', () => {
      const key = button.dataset.section;
      if (!document.body.classList.contains('drawer-open')) App.openDrawer();
      const nav = document.getElementById('nav_' + key);
      if (nav) nav.setAttribute('aria-expanded', 'true');
      const target = document.getElementById('nav_' + key);
      if (target) target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
  });
</script>
</body>
</html>
